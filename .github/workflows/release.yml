name: release
# A tag vX.Y.Z on main makes the GitHub release: notes from the merged pull requests, the source archive Securo
# installs, its CycloneDX SBOM and a build provenance attestation. The tag must match pyproject.toml and the manifest.
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches pyproject.toml and securo-plugin.json
        run: |
          python3 - <<'PY'
          import json, os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          manifest = json.load(open("securo-plugin.json"))["version"]
          sys.exit(0 if tag == f"v{project}" == f"v{manifest}" else f"tag {tag}, pyproject {project}, manifest {manifest}")
          PY
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Source archive
        run: git archive --format=tar.gz --prefix="securo-ing-fints-${GITHUB_REF_NAME#v}/" -o "securo-ing-fints-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_REF_NAME"
      - name: SBOM of the runtime dependencies
        uses: anchore/sbom-action@v0
        with:
          file: requirements.txt
          format: cyclonedx-json
          output-file: securo-ing-fints-${{ github.ref_name }}.cdx.json
          upload-artifact: false
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: securo-ing-fints-*.tar.gz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          headline=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" securo-ing-fints-*.tar.gz securo-ing-fints-*.cdx.json --title "$headline" --generate-notes
